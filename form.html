<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="" method="post">
        <table align="center">
            <tr>
                <td>Username</td>
                <td><input type="text" name="txtuser" id="" placeholder="isi dengan benar"></td>
            </tr>
            <tr>
                <td>Passsword</td>
                <td><input type="password" name="txtpass" id="" placeholder="minimal 6 karakter"></td>
            </tr>
            <tr>
                <td>Umur</td>
                <td><input type="number" name="txtumur" id="" min="17" max="50"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>
                <input type="radio" name="jkel" id="" value="P">Pria
                <input type="radio" name="jkel" id="" value="W">Wanita
                </td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td><textarea name="txtalm" id="" rows="1" cols="21"></textarea></td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td><input type="date" name="txttgl" id=""></td>
            </tr>
            <tr>
                <td>Jurusan</td>
                <td><select name="txtjur" id="">
                    <optgroup label="FTD">
                        <option value="TI">Teknik Informatika</option>
                        <option value="SK">Sistem Komputer</option>
                        <option value="DKV">Desain Komusnikasi Visual</option>
                    </optgroup>
                    <optgroup label="FEB">
                        <option value="MJ">Manajemen</option>
                        <option value="AK">Akuntansi</option>
                        <option value="IBM">Internasional Bisnis Management</option>
                    </optgroup>
                </select></td>
            </tr>
            <tr>
                <td></td>
                <td>
                <input type="submit" value="Kirim" name="cmdkirim">
                <input type="reset" value="Batal" name="cmdbatal">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
